<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- 背景粒子動畫 -->
  <canvas id="bg-canvas"></canvas>

  <header>
    <h1>Private Cloud</h1>
    <label id="toggle-hidden-label">
      <input type="checkbox" id="toggle-hidden" />
      顯示隱藏檔案
    </label>
  </header>

  <main>
    <nav id="breadcrumb"></nav>
    <div id="file-toolbar">
      <button id="btn-upload">上傳檔案</button>
      <input type="file" id="upload-input" multiple hidden />
      <div id="sort-controls">
        <select id="sort-by">
          <option value="name">名稱</option>
          <option value="ctime">建立時間</option>
        </select>
        <button id="sort-order-btn" title="切換排序方向"></button>
      </div>
    </div>
    <section id="file-list"></section>
  </main>

  <!-- 媒體瀏覽器（含文字編輯器） -->
  <div id="media-viewer" hidden>
    <div id="media-overlay"></div>
    <div id="media-panel">
      <div id="media-toolbar">
        <span id="media-filename"></span>
        <button id="btn-media-save" hidden>儲存</button>
        <a id="btn-raw-download">下載</a>
        <button id="btn-media-close">✕ 關閉</button>
      </div>
      <div id="media-body"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
